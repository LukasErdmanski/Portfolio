<ng-container *ngIf="isRouteValid">
  <div class="TUTAJ" [class.hidden]="scrollIntoViewAtNavigationEnd">
    <app-rotate-device-info
      [hidden]
      class="landscape-orientation"
    ></app-rotate-device-info>

    <div class="portrait-orientation">
      <header [class.header-navmenu-open]="this.navMenuService.isMenuOpen()">
        <div class="header-wrapper">
          <app-header></app-header>
          <nav>
            <app-navmenu *ngIf="this.navMenuService.isMenuOpen()"></app-navmenu>
          </nav>
        </div>
      </header>

      <main
        id="main"
        [class.dark-scroll-background]="this.navMenuService.isMenuOpen()"
      >
        <router-outlet ></router-outlet>
      </main>

      <footer [class.dark-scroll-background]="this.navMenuService.isMenuOpen()">
        <app-footer></app-footer>
      </footer>
    </div>
  </div>
</ng-container>

<app-not-found
  *ngIf="!isRouteValid && scrollIntoViewAtNavigationEnd"
></app-not-found>
